name: Generate Behavior Lock npm lockfile

on:
  push:
    branches: [chore/use-behavior-lock-npm-0.2.0]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/use-behavior-lock-npm-0.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false
      - name: Generate exact npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.8.2
          test "$(npm --version)" = "10.8.2"
          npm pkg set 'devDependencies.behavior-lock=0.2.0'
          npm install --package-lock-only --ignore-scripts
          test "$(node -p "require('./package.json').devDependencies['behavior-lock']")" = "0.2.0"
          test "$(node -p "require('./package-lock.json').packages['node_modules/behavior-lock'].version")" = "0.2.0"
      - name: Commit generated manifest and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: pin behavior-lock 0.2.0"
          git push origin HEAD:chore/use-behavior-lock-npm-0.2.0
