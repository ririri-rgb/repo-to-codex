name: Behavior Lock

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build repo-to-codex
        run: npm run build

      - name: Verify Behavior Lock version
        run: test "$(npx --no-install behavior-lock --version)" = "0.2.0"

      - name: Verify CLI behavior
        run: npx --no-install behavior-lock verify
